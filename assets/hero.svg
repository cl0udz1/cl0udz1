<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Muhannad — Security and Software Engineering</title>
  <desc id="desc">Minimal dark navy GitHub profile banner with typography and an abstract geometric system motif.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1320"/>
      <stop offset="0.57" stop-color="#101E31"/>
      <stop offset="1" stop-color="#102138"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#467EB9" stop-opacity=".24"/>
      <stop offset=".6" stop-color="#467EB9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#467EB9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#6285AE" stroke-opacity=".095" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78B9F5"/>
      <stop offset="1" stop-color="#A6D8FC"/>
    </linearGradient>
    <clipPath id="safe"><rect x="0" y="0" width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#safe)">
    <rect width="1200" height="360" fill="url(#base)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="1020" cy="162" rx="380" ry="260" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" opacity=".75"/>
    <!-- Constructed shape: thoughtful systems, not generic tech decoration. -->
    <g transform="translate(1010 181)" fill="none" stroke-linecap="round">
      <circle r="118" stroke="#9BC4E7" stroke-opacity=".17" stroke-width="1.5"/>
      <circle r="84" stroke="#9BC4E7" stroke-opacity=".25" stroke-width="1.5"/>
      <circle r="46" stroke="#A6D8FC" stroke-opacity=".52" stroke-width="1.5"/>
      <path d="M -148 -36 L -97 -36 L -61 -7 M 36 29 L 100 29 L 148 67 M -124 101 L -70 55 M -22 -128 L 21 -84 L 118 -84" stroke="#A6D8FC" stroke-opacity=".37" stroke-width="1.3"/>
      <path d="M -58 -62 L 59 61 M -55 59 L 57 -57" stroke="#A6D8FC" stroke-opacity=".12" stroke-width="1"/>
      <circle cx="-148" cy="-36" r="4" fill="#95CFFF" stroke="none"/>
      <circle cx="148" cy="67" r="4" fill="#95CFFF" stroke="none"/>
      <circle cx="-124" cy="101" r="4" fill="#95CFFF" stroke="none"/>
      <circle cx="-22" cy="-128" r="4" fill="#95CFFF" stroke="none"/>
      <circle cx="0" cy="0" r="6" fill="#BCE4FF" stroke="none"/>
      <circle cx="0" cy="0" r="21" stroke="#BCE4FF" stroke-opacity=".20"/>
      <circle cx="64" cy="-55" r="4" fill="#7CB8E7" stroke="none"/>
      <circle cx="-70" cy="46" r="4" fill="#7CB8E7" stroke="none"/>
    </g>
    <rect x="52" y="50" width="11" height="11" rx="2" fill="#8DC8F7"/>
    <text x="75" y="61" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#A4B6CB">CL0UDZ1  /  GITHUB</text>
    <text x="53" y="173" font-family="Arial,Helvetica,sans-serif" font-size="85" font-weight="700" letter-spacing="1" fill="#F6F9FD">MUHANNAD</text>
    <rect x="54" y="195" width="49" height="3" rx="1.5" fill="#9AD5FF"/>
    <text x="54" y="241" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" letter-spacing="1.3" fill="#D0E2F1">SECURITY  /  SOFTWARE  /  SYSTEMS</text>
    <text x="54" y="296" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing=".4" fill="#92A9C2">Building useful tools with clarity, intent, and care.</text>
    <text x="1152" y="332" text-anchor="end" font-family="monospace" font-size="12" fill="#83A2C2" opacity=".8">01 / BUILD WITH PURPOSE</text>
  </g>
</svg>
